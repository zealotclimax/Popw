<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blind Box House · pop mart</title>
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#141118;--sub:#7b7482;--line:#ece7ef;--soft:#f5f2f7;--pri:#ff3d7f;--pri-ink:#ffffff;--po:.55;--h1:#ffe1ea;--h2:#e3efff;--h3:#fff1c9;--foot:#141118;--foot-ink:#f4eef8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121a;--card:#1f1a26;--ink:#f4eef8;--sub:#a99fb4;--line:#332c3d;--soft:#272130;--pri:#ff6b9d;--pri-ink:#2b1020;--po:.28;--h1:#3a2230;--h2:#22304a;--h3:#3a3320;--foot:#0e0c12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15121a;--card:#1f1a26;--ink:#f4eef8;--sub:#a99fb4;--line:#332c3d;--soft:#272130;--pri:#ff6b9d;--pri-ink:#2b1020;--po:.28;--h1:#3a2230;--h2:#22304a;--h3:#3a3320;--foot:#0e0c12;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.bgpat{position:fixed;inset:0;z-index:-1;background:var(--pat);background-size:180px;opacity:var(--po);pointer-events:none}
a{color:var(--pri)}[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.ann{background:var(--ink);color:var(--bg);font-size:13px;display:flex;gap:12px;justify-content:center;align-items:center;padding:8px 14px;text-align:center;flex-wrap:wrap}
.ann button{border:1px solid currentColor;background:none;color:inherit;border-radius:99px;padding:1px 10px;font:inherit;font-size:12px;cursor:pointer}
.top{border-bottom:1px solid var(--line);background:var(--bg)}
.top .in{display:flex;justify-content:space-between;align-items:center;height:60px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.nav{font-size:13px;color:var(--sub)}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--h1),var(--h2) 55%,var(--h3));padding:34px 0 40px}
.hero::before{content:"";position:absolute;inset:0;background:var(--pat);background-size:230px;opacity:.9}
.hero .wrap{position:relative}
.crumb{font-size:13px;color:var(--sub)}
.hero h1{margin:6px 0 4px;font-size:clamp(48px,11vw,104px);line-height:1;font-weight:800;letter-spacing:-.05em}
.hero p{margin:0;color:var(--sub)}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr .8fr .8fr;gap:10px;margin:22px 0 12px}
@media(max-width:820px){.tools{grid-template-columns:1fr 1fr}.tools #q{grid-column:1/-1}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--sub);font-size:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 16px}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:16px 10px}}
.card{cursor:pointer}
.pic{aspect-ratio:1/1;border-radius:14px;overflow:hidden;position:relative;background:var(--soft);display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .pic img{transform:scale(1.05)}
.ph span{font-size:72px;font-weight:800;color:rgba(255,255,255,.85)}
.bd{position:absolute;left:10px;top:10px;background:var(--ink);color:var(--bg);font-size:11px;letter-spacing:.06em;padding:2px 9px;border-radius:99px}
.so{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.info{padding:10px 2px 0}
.t{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s{font-size:12px;color:var(--sub);margin-top:2px}
.p{margin-top:4px;font-weight:700}
.empty{text-align:center;color:var(--sub);padding:50px 0;grid-column:1/-1}
.foot{background:var(--foot);color:var(--foot-ink);margin-top:60px;padding:40px 0 26px}
.fg{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px}
@media(max-width:760px){.fg{grid-template-columns:1fr}}
.foot h4{margin:0 0 10px;font-size:13px;letter-spacing:.08em;color:#a99fb4}
.foot p{margin:4px 0;font-size:14px}
.wxid{font-size:26px;font-weight:800;letter-spacing:.01em}
.cp{margin-top:8px}
.copy{font-size:12px;color:#a99fb4;border-top:1px solid #332c3d;margin-top:28px;padding-top:16px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.mask.show{display:flex}
.modal{background:var(--card);border-radius:20px;max-width:460px;width:100%;max-height:90%;overflow:auto}
.modal .pic{border-radius:0;aspect-ratio:1/1}
.thumbs{display:flex;gap:6px;padding:8px 18px 0;overflow-x:auto}
.thumbs img{width:52px;height:52px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.thumbs img.on{border-color:var(--pri)}
.body{padding:12px 18px 20px}
.body h2{margin:0 0 4px}
.body .p{font-size:20px;color:var(--pri)}
.rows{margin:12px 0;border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rows span:first-child{color:var(--sub)}
.contact{background:var(--soft);border-radius:12px;padding:12px;font-size:14px}
.btn{display:inline-block;border:0;border-radius:12px;background:var(--pri);color:var(--pri-ink);font:inherit;padding:9px 16px;cursor:pointer;text-align:center}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.close{margin-top:12px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
.toast.on{opacity:1}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:61;background:var(--bg);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.bar #st{flex:1;color:var(--sub);font-size:14px}
.hl{color:var(--sub);font-size:13px;margin:8px 0}
.arow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.f label{font-size:12px;color:var(--sub)}
.aimgs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 8px;align-items:center}
.th{position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;right:2px;top:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.acts{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;font-size:14px}
.tip{color:var(--sub);font-size:13px}
.lg{text-align:center;color:var(--sub);padding:50px 0}
.lg input{max-width:240px;display:inline-block;width:auto}
.ann{justify-content:space-between;gap:8px 14px}
.lang{border:1px solid currentColor;background:none;color:inherit;border-radius:99px;padding:2px 12px;font:inherit;font-size:12px;cursor:pointer}
.ctw{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.ct{border:1px solid rgba(255,255,255,.35);background:none;color:inherit;border-radius:99px;padding:1px 10px;font:inherit;font-size:12px;cursor:pointer}
.ct b{margin-left:3px}
.contact .ct{border-color:var(--line);color:var(--ink);background:var(--card);margin:6px 6px 2px 0;font-size:13px;padding:3px 10px}
.cl{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:14px;flex-wrap:wrap}
.cl span{color:#a99fb4;min-width:84px}.cl b{font-size:16px}
.sec{margin:0 0 10px;font-weight:700}
@media(max-width:640px){.ann{justify-content:center}.ctw{justify-content:center}}
</style>
</head>
<body>
<div class="bgpat"></div>
<div id="shop">
<div class="ann"><button class="lang" id="lang"></button><div class="ctw" id="ctTop"></div></div>
<header class="top"><div class="wrap in"><a class="logo" href="#" data-i="brand"></a><span class="nav" data-i="nav"></span></div></header>
<section class="hero"><div class="wrap"><div class="crumb" data-i="crumb"></div><h1>pop mart</h1><p data-i="sub"></p></div></section>
<div class="wrap">
<div class="tools">
<input id="q" type="search" data-ip="search">
<select id="sort"></select><select id="av"></select><select id="cond"></select>
<input id="mn" type="number" min="0" data-ip="min"><input id="mx" type="number" min="0" data-ip="max">
</div>
<div class="chips" id="chips"></div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
</div>
<footer class="foot"><div class="wrap"><div class="fg">
<div><h4 data-i="brand"></h4><p data-i="about"></p></div>
<div><h4 data-i="fcontact"></h4><div id="ctFoot"></div></div>
<div><h4 data-i="notice"></h4><p data-i="n1"></p><p data-i="n2"></p></div>
</div><div class="copy" data-i="legal"></div></div></footer>
</div>
<div id="adm" class="wrap" hidden></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
var CUR="$";
var DEFC={wechat:"johnny_jai_fu"};
var DATA={v:2,contacts:DEFC,items:[]},PW=sessionStorage.getItem("pw")||"",CAN=false,DIRTY=false,MSG="";
var COND=["全新未拆","已拆未摆","轻微使用","无盒/散货"];
var COND_EN=["Brand new, sealed","Opened, unused","Lightly used","Loose / no box"];
// 联系方式类型：[键, 英文名, 中文名]。新增类型时同步修改 lib/store.js 的 CONTACT_KEYS。
var CT=[["wechat","WeChat","微信"],["phone","Phone","电话"],["instagram","Instagram","Instagram"],["email","Email","邮箱"],["whatsapp","WhatsApp","WhatsApp"]];
var PAL=[["#ffd1dc","#ffb3c8"],["#d6f0e0","#a9e2c4"],["#e0d4f7","#c3adef"],["#cfe6ff","#9fcbff"],["#ffe3c4","#ffc98f"],["#c9f0f2","#8fdde2"]];
var S={series:"",q:"",cond:"",av:"all",min:"",max:"",sort:"new"};
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ===== 双语 ===== */
var I={en:{brand:"Blind Box House",nav:"Pre-owned pop mart",crumb:"Home / pop mart",sub:"Pre-owned Pop Mart · blind boxes, figures & pendants",search:"Search name or series…",min:"Min $",max:"Max $",sortNew:"Newest first",sortAsc:"Price: low to high",sortDesc:"Price: high to low",avAll:"All status",avIn:"Available",avOut:"Sold",condAll:"All conditions",all:"All",count:"{n} items",loadFail:"Failed to load items. Please refresh the page.",empty:"No items match your filters.",isNew:"NEW",sold:"SOLD",series:"Series",cond:"Condition",box:"Includes",want:"Interested? Contact the seller:",ask:"Please mention the item name; the deal is arranged directly.",cp:"Copy",copied:"Copied: ",close:"Close",about:"A small showcase of pre-owned Pop Mart collectibles, with real photos and condition notes.",fcontact:"Contact",notice:"How to buy",n1:"This site is a showcase only; online payment is not available.",n2:"Message the seller with the item name to arrange the deal.",legal:"© {b} · Not affiliated with Pop Mart. All items are personal pre-owned collectibles."},
zh:{brand:"闲置盲盒屋",nav:"二手 pop mart",crumb:"首页 / pop mart",sub:"二手泡泡马特 · 盲盒、手办、挂件",search:"搜索名称或系列…",min:"最低价 $",max:"最高价 $",sortNew:"最新上架",sortAsc:"价格从低到高",sortDesc:"价格从高到低",avAll:"全部状态",avIn:"在售",avOut:"已售出",condAll:"全部成色",all:"全部",count:"共 {n} 件商品",loadFail:"商品加载失败，请刷新页面。",empty:"暂时没有符合条件的商品～",isNew:"新上架",sold:"已售出",series:"系列",cond:"成色",box:"配件",want:"想要这件？请联系卖家：",ask:"请告知商品名称，线下沟通交易。",cp:"复制",copied:"已复制：",close:"关闭",about:"二手泡泡马特展示站，每件都有实物图和成色说明。",fcontact:"联系方式",notice:"购买须知",n1:"本站只展示商品，不提供在线支付。",n2:"看中请联系卖家，告知商品名称后沟通。",legal:"© {b} · 与泡泡马特官方无关联，商品均为个人闲置转让"}};
var LANG="en";try{if(localStorage.getItem("lang")==="zh")LANG="zh"}catch(e){}
function brand(){var n=DATA.siteName&&DATA.siteName[LANG];return n&&n.trim()?n.trim():I[LANG].brand}
function t(k){if(k==="brand")return brand();var v=(I[LANG]&&I[LANG][k])||I.en[k]||k;return k==="legal"?v.replace("{b}",brand()):v}
function cl(c){return LANG==="zh"?c:(COND_EN[COND.indexOf(c)]||c)}
function pick(i,f){return LANG==="en"&&i[f+"En"]?i[f+"En"]:i[f]}
function fill(sel,arr,v){$(sel).innerHTML=arr.map(function(a){return '<option value="'+a[0]+'">'+t(a[1])+'</option>'}).join("");$(sel).value=v}
function applyLang(){
  document.documentElement.lang=LANG==="zh"?"zh-CN":"en";
  document.title=t("brand")+" · pop mart";
  document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=t(el.getAttribute("data-i"))});
  document.querySelectorAll("[data-ip]").forEach(function(el){el.placeholder=t(el.getAttribute("data-ip"))});
  $("#lang").textContent=LANG==="en"?"中文":"EN";
  fill("#sort",[["new","sortNew"],["asc","sortAsc"],["desc","sortDesc"]],S.sort);
  fill("#av",[["all","avAll"],["in","avIn"],["out","avOut"]],S.av);
  $("#cond").innerHTML='<option value="">'+t("condAll")+'</option>'+COND.map(function(c){return '<option value="'+c+'">'+cl(c)+'</option>'}).join("");
  $("#cond").value=S.cond;
  $("#mask").classList.remove("show");
  contacts();shop();
}
$("#lang").addEventListener("click",function(){LANG=LANG==="en"?"zh":"en";try{localStorage.setItem("lang",LANG)}catch(e){}applyLang()});

/* 盲盒主题背景图案（原创插画：盲盒、星星、爱心） */
var TILE="<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><g stroke-linejoin='round' stroke-linecap='round'>"+
"<path d='M28 44l22-11 22 11v26l-22 11-22-11z' fill='#ff3d7f' fill-opacity='.4'/><path d='M28 44l22 11 22-11M50 55v26' fill='none' stroke='#ff3d7f' stroke-opacity='.55' stroke-width='2'/>"+
"<text x='43' y='73' font-size='17' font-weight='700' fill='#fff' fill-opacity='.95'>?</text>"+
"<path d='M130 28l4.5 10 11 1.2-8.3 7.4 2.4 10.8-9.6-5.6-9.6 5.6 2.4-10.8-8.3-7.4 11-1.2z' fill='#ffc233' fill-opacity='.6'/>"+
"<path d='M118 138c-13-10-20-17-20-25a10 10 0 0 1 20-3 10 10 0 0 1 20 3c0 8-7 15-20 25z' fill='#5bbcff' fill-opacity='.4'/>"+
"<path d='M30 128v16M22 136h16' fill='none' stroke='#a56bff' stroke-opacity='.6' stroke-width='3'/>"+
"<circle cx='86' cy='96' r='4.5' fill='#2fd0a0' fill-opacity='.5'/><circle cx='156' cy='96' r='3' fill='#ff3d7f' fill-opacity='.4'/></g></svg>";
document.documentElement.style.setProperty("--pat",'url("data:image/svg+xml,'+encodeURIComponent(TILE)+'")');

function toast(m){var x=$("#toast");x.textContent=m;x.classList.add("on");clearTimeout(toast.k);toast.k=setTimeout(function(){x.classList.remove("on")},1700)}
function copy(v){
  function done(){toast(t("copied")+v)}
  function fb(){var i=document.createElement("input");i.value=v;document.body.appendChild(i);i.select();try{document.execCommand("copy")}catch(e){}i.remove();done()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,fb);else fb();
}
document.addEventListener("click",function(e){var b=e.target.closest("[data-copy]");if(b)copy(b.getAttribute("data-copy"))});

/* ===== 联系方式 ===== */
function cts(){var c=DATA.contacts||{};return CT.filter(function(x){return c[x[0]]}).map(function(x){return{l:LANG==="zh"?x[2]:x[1],v:c[x[0]]}})}
function chipsHtml(){return cts().map(function(c){return '<button class="ct" data-copy="'+esc(c.v)+'">'+esc(c.l)+' <b>'+esc(c.v)+'</b></button>'}).join("")}
function contacts(){
  $("#ctTop").innerHTML=chipsHtml();
  $("#ctFoot").innerHTML=cts().map(function(c){return '<div class="cl"><span>'+esc(c.l)+'</span><b>'+esc(c.v)+'</b><button class="btn ghost sm" data-copy="'+esc(c.v)+'">'+t("cp")+'</button></div>'}).join("");
}

/* ===== 店铺页 ===== */
function pic(it,extra,k){
  if(it.imgs&&it.imgs.length)return '<div class="pic"><img loading="lazy" src="'+it.imgs[k||0]+'" alt="">'+(extra||"")+'</div>';
  var p=PAL[it.id%PAL.length];
  return '<div class="pic ph" style="background:linear-gradient(135deg,'+p[0]+','+p[1]+')"><span>?</span>'+(extra||"")+'</div>';
}
function chips(){
  var l=[""];DATA.items.forEach(function(i){if(i.series&&l.indexOf(i.series)<0)l.push(i.series)});
  $("#chips").innerHTML=l.map(function(s){return '<button class="chip'+(s===S.series?' on':'')+'" data-s="'+esc(s)+'">'+esc(s||t("all"))+'</button>'}).join("");
}
function shop(){
  chips();
  var q=S.q.trim().toLowerCase(),mn=S.min===""?0:+S.min,mx=S.max===""?Infinity:+S.max;
  var newest=DATA.items.map(function(i){return i.id}).sort(function(a,b){return b-a}).slice(0,3);
  var r=DATA.items.filter(function(i){
    return (S.series===""||i.series===S.series)&&(!S.cond||i.cond===S.cond)&&(S.av==="all"||(S.av==="in")!==!!i.sold)&&i.price>=mn&&i.price<=mx&&(!q||(i.name+" "+(i.nameEn||"")+" "+i.series).toLowerCase().indexOf(q)>=0);
  });
  if(S.sort==="asc")r.sort(function(a,b){return a.price-b.price});
  else if(S.sort==="desc")r.sort(function(a,b){return b.price-a.price});
  else r.sort(function(a,b){return b.id-a.id});
  $("#count").textContent=window.LOADERR?t("loadFail"):t("count").replace("{n}",r.length);
  $("#grid").innerHTML=r.length?r.map(function(i){
    var ex=(i.sold?'<div class="so">'+t("sold")+'</div>':(newest.indexOf(i.id)>=0?'<span class="bd">'+t("isNew")+'</span>':''));
    return '<div class="card" data-id="'+i.id+'">'+pic(i,ex)+'<div class="info"><div class="t">'+esc(pick(i,"name"))+'</div><div class="s">'+esc(i.series)+(i.cond?' · '+esc(cl(i.cond)):'')+'</div><div class="p">'+CUR+esc(i.price)+'</div></div></div>';
  }).join(""):'<div class="empty">'+t("empty")+'</div>';
}
function detail(id,k){
  var i=DATA.items.filter(function(x){return x.id===id})[0];if(!i)return;
  k=k||0;
  var th=(i.imgs&&i.imgs.length>1)?'<div class="thumbs">'+i.imgs.map(function(g,n){return '<img src="'+g+'" data-id="'+id+'" data-k="'+n+'" class="'+(n===k?'on':'')+'" alt="">'}).join("")+'</div>':"";
  $("#modal").innerHTML=pic(i,"",k)+th+'<div class="body"><h2>'+esc(pick(i,"name"))+'</h2><div class="p">'+CUR+esc(i.price)+(i.sold?' · '+t("sold"):'')+'</div>'+
  '<div class="rows"><div><span>'+t("series")+'</span><span>'+esc(i.series)+'</span></div><div><span>'+t("cond")+'</span><span>'+esc(cl(i.cond))+'</span></div><div><span>'+t("box")+'</span><span>'+esc(pick(i,"box"))+'</span></div></div>'+
  '<p>'+esc(pick(i,"note"))+'</p><div class="contact">'+t("want")+'<br>'+chipsHtml()+'<br><small>'+t("ask")+'</small></div><button class="btn close" id="x">'+t("close")+'</button></div>';
  $("#mask").classList.add("show");
}

/* 图片压缩：优先 WebP，自适应质量，目标 ≤ 220KB；本身够小的原图直接上传，不做二次压缩 */
async function loadImg(file){
  try{return await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){return await new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=function(){rej(new Error("无法读取图片"))};im.src=URL.createObjectURL(file)})}
}
function enc(c,ty,q){return new Promise(function(res){c.toBlob(res,ty,q)})}
async function shrink(file){
  var MAXS=1200,TARGET=220*1024;
  var im=await loadImg(file),w=im.width,h=im.height,lg=Math.max(w,h);
  if(file.size<=TARGET&&lg<=MAXS&&/^image\/(jpeg|webp)$/.test(file.type))return file;
  var best=null;
  for(var side=Math.min(lg,MAXS);;side=Math.round(side*.85)){
    var sc=side/lg,c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
    var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    for(var q=.86;q>=.58;q-=.07){
      var b=await enc(c,"image/webp",q);
      if(!b||b.type!=="image/webp")b=await enc(c,"image/jpeg",q);
      if(b&&(!best||b.size<best.size))best=b;
      if(b&&b.size<=TARGET)return b;
    }
    if(side<=800)break;
  }
  return best;
}
async function upload(it,files){
  var before=0,after=0;
  try{
    for(var n=0;n<files.length;n++){MSG="上传中 "+(n+1)+"/"+files.length+"…";stat();
      var b=await shrink(files[n]);before+=files[n].size;after+=b.size;
      var r=await api("/api/upload",b,b.type);it.imgs=(it.imgs||[]).concat([r.url])}
    DIRTY=true;MSG="已上传（图片已优化："+Math.round(before/1024)+"KB → "+Math.round(after/1024)+"KB）";admin();
  }catch(e){MSG="上传失败："+e.message;stat()}
}
async function save(){MSG="发布中…";stat();try{await api("/api/save",JSON.stringify(DATA),"application/json");DIRTY=false;MSG="已发布 ✓"}catch(e){MSG="发布失败："+e.message}stat()}
async function login(){
  PW=$("#pw").value;
  try{await api("/api/auth","","text/plain");sessionStorage.setItem("pw",PW);CAN=true;MSG="";admin()}
  catch(e){PW="";MSG=e.message==="密码不正确"?"密码不正确":(/ISO-8859-1/.test(e.message)?"密码只能包含英文字母、数字和半角符号":"登录失败："+e.message);stat()}
}

  else if(a==="del"&&it&&confirm("确定删除“"+it.name+"”？")){DATA.items=DATA.items.filter(function(x){return x!==it});DIRTY=true;MSG="";admin()}
  else if(a==="rm"&&it){it.imgs.splice(+b.getAttribute("data-k"),1);DIRTY=true;MSG="";admin()}
});
